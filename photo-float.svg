<svg width="180" height="220" viewBox="0 0 180 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="circleClip">
      <circle cx="90" cy="95" r="72"/>
    </clipPath>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A9DF4"/>
      <stop offset="100%" stop-color="#1e3c72"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Animation flottante type ballon : monte et redescend doucement -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 0,-14; 0,0"
      keyTimes="0; 0.5; 1"
      dur="3.2s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" />

    <!-- Anneau décoratif -->
    <circle cx="90" cy="95" r="76" fill="none" stroke="url(#ringGradient)" stroke-width="4"/>

    <!-- Photo de profil, recadrée en cercle -->
    <image href="https://raw.githubusercontent.com/Ruphin87/Ruphin87/main/ruphin.png"
           x="18" y="23" width="144" height="144"
           clip-path="url(#circleClip)"
           preserveAspectRatio="xMidYMid slice" />
  </g>
</svg>
